name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1

      - name: Frontend deps
        run: npm --prefix frontend install

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l . 2>/dev/null | grep -v '^\.legacy-build' || true)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Build (linux smoke)
        run: wails build -platform linux/amd64 -skipbindings
        env:
          CGO_ENABLED: 0
